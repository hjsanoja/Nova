# Publica la app en GitHub Pages (https://<usuario>.github.io/<repositorio>/). Se lanza a mano: Actions → este flujo → Run workflow.
# Requisitos: Settings → Pages → Source: "GitHub Actions"; y el repositorio público o un plan de pago (Pages no funciona
# con repositorios privados en el plan gratuito). Para publicar en cada cambio de main, añadir `push: branches: [main]`.
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
