# Publica la app en GitHub Pages en cada cambio de main (https://<usuario>.github.io/<repositorio>/).
# Requisito, una sola vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# (Con "Deploy from a branch" GitHub publica el código fuente sin compilar y la página se ve en blanco.)
# Conexión ya configurada para todos: en Settings → Secrets and variables → Actions → pestaña "Variables" crea
# VITE_SUPABASE_URL (https://<proyecto>.supabase.co) y VITE_SUPABASE_ANON_KEY (la clave pública "anon").
# Quedan dentro de la app publicada y nadie tiene que escribirlas al abrir el enlace.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4

  # Deja la versión publicada en GitHub → Releases (la marcada "Latest" es la activa). Si no se puede (permisos del
  # repositorio), la publicación de la app no se ve afectada.
  version:
    needs: publicar
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar la versión en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src/novedades.json')[0].version")
          if gh release view "v$V" >/dev/null 2>&1; then echo "La v$V ya está publicada."; exit 0; fi
          node scripts/verificar-version.mjs --notas > notas.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "NOVA v$V" --notes-file notas.md
